<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI-TEC MBTI 분석 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0d0f14; --bg2:#151820; --bg3:#1c2030; --bg4:#222840;
  --border:#2a3050; --border2:#3a4570;
  --text:#e8eaf2; --text2:#9aa0bc; --text3:#5a6080;
  --accent:#5b7fff; --gold:#f0b840; --teal:#40d4b8;
  --coral:#ff6b6b; --purple:#a07aff; --green:#4dbb8a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
.header{background:linear-gradient(135deg,#0d0f14,#151828,#0d1220);border-bottom:1px solid var(--border);padding:1.5rem 2rem;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-60px;right:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(91,127,255,.1) 0%,transparent 70%);border-radius:50%}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:44px;height:44px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#fff;text-align:center;line-height:1.3}
.brand-text h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.brand-text p{font-size:12px;color:var(--text2);margin-top:1px}
.header-stats{display:flex;gap:20px;flex-wrap:wrap}
.hstat{text-align:right}
.hstat-val{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--accent)}
.hstat-lbl{font-size:11px;color:var(--text3)}
.nav{display:flex;gap:4px;padding:.75rem 2rem;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto;scrollbar-width:none;flex-wrap:wrap}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;white-space:nowrap;transition:all .2s}
.nav-btn:hover{border-color:var(--border2);color:var(--text)}
.nav-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.main{padding:1.25rem 2rem;max-width:1400px}
.section{display:none}
.section.active{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.4rem;margin-bottom:1rem}
.card-title{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:.9rem;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:13px;background:var(--accent);border-radius:2px;display:inline-block;flex-shrink:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.metric{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:.9rem 1.1rem}
.metric-val{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:var(--text)}
.metric-lbl{font-size:12px;color:var(--text2);margin-top:3px}
.metric-sub{font-size:11px;color:var(--text3);margin-top:2px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);width:40px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:20px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.23,1,.32,1);display:flex;align-items:center;padding-left:7px}
.bar-fill span{font-size:10px;font-weight:500;color:rgba(255,255,255,.9)}
.bar-count{font-size:12px;color:var(--text2);width:32px;flex-shrink:0;text-align:right}
.dim-row{margin-bottom:12px}
.dim-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:3px}
.dim-labels strong{color:var(--text);font-weight:500}
.dim-track{height:14px;border-radius:7px;overflow:hidden;display:flex}
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:7px}
.member-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:.75rem .9rem;cursor:pointer;transition:all .2s}
.member-card:hover{border-color:var(--border2);background:var(--bg4);transform:translateY(-1px)}
.member-card.selected{border-color:var(--accent);background:var(--bg4)}
.member-name{font-size:13px;font-weight:500;color:var(--text)}
.member-role{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4}
.mbti-pill{display:inline-block;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:5px}
.filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.9rem}
.filter-btn{padding:4px 11px;font-size:12px;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.detail-panel{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.4rem;margin-top:.9rem;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:.9rem;padding-bottom:.8rem;border-bottom:1px solid var(--border)}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.detail-info h3{font-size:15px;font-weight:500;color:var(--text)}
.detail-info p{font-size:12px;color:var(--text3);margin-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item label{font-size:11px;color:var(--text3);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.detail-item p{font-size:13px;color:var(--text);line-height:1.5}
.tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--bg4);color:var(--text2)}
.org-part{margin-bottom:1.4rem}
.org-part-title{font-size:12px;font-weight:500;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:.5rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.org-members{display:flex;flex-wrap:wrap;gap:5px}
.org-member{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:99px;padding:3px 9px 3px 5px;font-size:12px}
.org-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.compat-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.7rem}
.compat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.compat-pair{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--text)}
.stars{color:var(--gold);font-size:12px}
.compare-select-row{display:flex;align-items:center;gap:12px;margin-bottom:1.3rem;flex-wrap:wrap}
.compare-select-row select{padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Space Mono',monospace;font-size:12px;cursor:pointer}
.vs-divider{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--text3)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.compare-col{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:1.1rem}
.compare-col-header{margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--border)}
.compare-mbti{font-family:'Space Mono',monospace;font-size:22px;font-weight:700}
.compare-row{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--border)}
.compare-row:last-child{border-bottom:none}
.compare-key{font-size:11px;color:var(--text3);width:56px;flex-shrink:0}
.compare-val{font-size:12px;color:var(--text);text-align:right;line-height:1.5}
.proposal-section{margin-bottom:1.8rem}
.proposal-section-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.proposal-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.4rem;margin-bottom:.7rem}
.proposal-card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:.7rem}
.proposal-badge{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.proposal-title{font-size:14px;font-weight:500;color:var(--text)}
.proposal-body{font-size:13px;color:var(--text2);line-height:1.75}
.proposal-body ul{padding-left:1.1rem;margin-top:.3rem}
.proposal-body li{margin-bottom:.25rem}
.proposal-body strong{color:var(--text)}
.proposal-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:.7rem}
.proposal-tag{font-size:11px;font-family:'Space Mono',monospace;padding:2px 7px;border-radius:4px;background:var(--bg4);color:var(--text2);border:1px solid var(--border)}
.fun-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:1rem 1.3rem;margin-bottom:.7rem;display:flex;gap:12px}
.fun-ico{font-size:20px;flex-shrink:0;margin-top:1px}
.fun-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:.25rem}
.fun-body{font-size:13px;color:var(--text2);line-height:1.65}
.fun-body strong{color:var(--text)}
.chart-wrap{position:relative;width:100%}
select{padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:12px;cursor:pointer}
button{font-family:'Noto Sans KR',sans-serif}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
table{width:100%;border-collapse:collapse}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon">CI<br>TEC</div>
      <div class="brand-text">
        <h1>CI-TEC MBTI 분석 대시보드</h1>
        <p>IT 기술지원 부서 · 인프라 &amp; 소프트웨어 파트</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="hstat"><div class="hstat-val">27</div><div class="hstat-lbl">전체 부서원</div></div>
      <div class="hstat"><div class="hstat-val">11</div><div class="hstat-lbl">MBTI 유형 수</div></div>
      <div class="hstat"><div class="hstat-val" id="hs-i">85%</div><div class="hstat-lbl">내향형 비율</div></div>
      <div class="hstat"><div class="hstat-val" id="hs-sj">52%</div><div class="hstat-lbl">SJ 기질 비율</div></div>
    </div>
  </div>
</div>
<div class="nav" id="navBar"></div>
<div class="main">
<div id="sec-overview" class="section">
  <div class="g4" id="topMetrics" style="margin-bottom:1rem"></div>
  <div class="g2">
    <div class="card"><div class="card-title">MBTI 유형 분포</div><div id="typeChart"></div></div>
    <div>
      <div class="card"><div class="card-title">4가지 지표 비율</div><div id="dimChart"></div></div>
      <div class="card"><div class="card-title">기질 그룹</div><div id="temperChart"></div></div>
    </div>
  </div>
  <div class="card"><div class="card-title">유형별 비중 도넛 차트</div><div class="chart-wrap" style="height:260px"><canvas id="donutChart"></canvas></div></div>
</div>
<div id="sec-members" class="section">
  <div class="card"><div class="card-title">멤버 탐색</div><div class="filter-row" id="filterRow"></div><div class="member-grid" id="memberGrid"></div><div id="memberDetail"></div></div>
</div>
<div id="sec-profiles" class="section">
  <div class="card" style="margin-bottom:1rem"><div class="card-title">개인 상세 프로파일</div><div class="filter-row" id="profileFilterRow"></div><div class="member-grid" id="profileGrid"></div></div>
  <div id="profileDetail"></div>
</div>
<div id="sec-org" class="section">
  <div class="card"><div class="card-title">조직별 MBTI 분포</div><div id="orgView"></div></div>
  <div class="g2">
    <div class="card"><div class="card-title">파트별 유형 분포</div><div class="chart-wrap" style="height:250px"><canvas id="partChart"></canvas></div></div>
    <div class="card"><div class="card-title">파트별 역량 레이더</div><div class="chart-wrap" style="height:250px"><canvas id="partDimChart"></canvas></div></div>
  </div>
</div>
<div id="sec-compat" class="section">
  <div class="card"><div class="card-title">파트 내 주요 유형 조합 시너지</div><div id="compatView"></div></div>
</div>
<div id="sec-compare" class="section">
  <div class="card"><div class="card-title">두 유형 비교</div>
    <div class="compare-select-row"><select id="cmpA"></select><span class="vs-divider">VS</span><select id="cmpB"></select></div>
    <div class="compare-grid" id="comparePanel"></div>
  </div>
</div>
<div id="sec-growth" class="section"><div id="growthView"></div></div>
<div id="sec-dynamics" class="section"><div id="dynamicsView"></div></div>
<div id="sec-conflict" class="section"><div id="conflictView"></div></div>
<div id="sec-playbook" class="section"><div id="playbookView"></div></div>
<div id="sec-mood" class="section"><div id="moodView"></div></div>
<div id="sec-matcher" class="section"><div id="matcherView"></div></div>
<div id="sec-simulator" class="section"><div id="simulatorView"></div></div>
<div id="sec-okr" class="section"><div id="okrView"></div></div>
<div id="sec-fun" class="section"><div class="card"><div class="card-title">CI-TEC 특별 인사이트</div><div id="funView"></div></div></div>
</div>

function updateFilter(btn){
  document.querySelectorAll('#filterRow .filter-btn').forEach(function(x){x.classList.remove('on');});
  btn.classList.add('on');
  selectedMember=null;
  document.getElementById('memberDetail').innerHTML='';
  renderMembers();
}

function renderMembers(){
  const grid=document.getElementById('memberGrid');
  const filtered=activeFilter?members.filter(function(m){return m.mbti===activeFilter;}):members;
  grid.innerHTML='';
  filtered.forEach(function(m){
    const col=COLORS[m.mbti]||'#888';
    const div=document.createElement('div');
    div.className='member-card'+(selectedMember===m.name?' selected':'');
    div.innerHTML='<div class="member-name">'+m.name+(m.leader?'<span style="font-size:10px;color:var(--gold);margin-left:4px">▲</span>':'')+'</div><div class="member-role">'+m.role+'</div><span class="mbti-pill" style="background:'+col+'22;color:'+col+'">'+m.mbti+'</span>';
    div.onclick=function(){
      selectedMember=m.name;
      document.querySelectorAll('#memberGrid .member-card').forEach(function(x){x.classList.remove('selected');});
      div.classList.add('selected');
      showMemberDetail(m);
    };
    grid.appendChild(div);
  });
}

(function(){

  ['matchA','matchB'].forEach(function(id,i){
    const sel=document.getElementById(id);
    members.forEach(function(m,j){
      const opt=document.createElement('option');
      opt.value=m.name;
      opt.textContent=m.name+' ('+m.mbti+')';
      if((i===0&&j===0)||(i===1&&j===3)) opt.selected=true;
      sel.appendChild(opt);
    });
  });

  function calcComm(mbtiA,mbtiB){
    const direct=function(t){return (t[2]==='T'?2:0)+(t[3]==='J'?2:0)+(t[0]==='E'?1:0);};
    const speed=function(t){return (t[0]==='E'?2:0)+(t[3]==='P'?2:0)+(t[1]==='S'?1:0);};
    const detail=function(t){return (t[3]==='J'?2:0)+(t[1]==='N'?2:0)+(t[2]==='T'?1:0);};
    const emotion=function(t){return (t[2]==='F'?3:0)+(t[0]==='E'?1:0)+(t[1]==='N'?1:0);};
    const gap=function(fn){return Math.abs(fn(mbtiA)-fn(mbtiB));};
    const harmony=Math.max(20,100-gap(direct)*12-gap(speed)*8-gap(emotion)*10);
    const scores={직접성:Math.round((direct(mbtiA)+direct(mbtiB))/2*20),속도:Math.round((speed(mbtiA)+speed(mbtiB))/2*20),상세도:Math.round((detail(mbtiA)+detail(mbtiB))/2*20),감성도:Math.round((emotion(mbtiA)+emotion(mbtiB))/2*20)};
    const shared=[],diff=[];
    if(mbtiA[0]===mbtiB[0]) shared.push(mbtiA[0]==='I'?'둘 다 내향형 — 독립적 집중 시간 선호':'둘 다 외향형 — 활발한 소통 선호');

    else diff.push('인식 방식 차이(N/S) — 추상 vs 구체 언어 조율 필요');
    if(mbtiA[2]===mbtiB[2]) shared.push(mbtiA[2]==='T'?'사고형 공통 — 논리·효율 우선':'감정형 공통 — 관계·공감 중심 소통');
    else diff.push('판단 기준 차이(T/F) — 피드백 방식 특히 주의');
    if(mbtiA[3]===mbtiB[3]) shared.push(mbtiA[3]==='J'?'판단형 공통 — 계획·마감 존중':'인식형 공통 — 유연한 변경 수용');
    else diff.push('생활 방식 차이(J/P) — 계획 vs 즉흥 충돌 가능');
    const tips=[];

    if(mbtiA[3]!==mbtiB[3]) tips.push('계획 변경 시 최소 48시간 전 사전 공유 권장');
    return{harmony,frictionRisk:100-harmony,scores,shared,diff,tips};

(function(){
  const sv=document.getElementById('simulatorView');
  sv.innerHTML='<div class="card"><div class="card-title">프로젝트 팀 구성 시뮬레이터</div><div style="font-size:13px;color:var(--text2);margin-bottom:.9rem">멤버를 선택하여 팀을 구성하고 MBTI 균형 점수·집단사고 위험도를 확인하세요. (4~6명 권장)</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.9rem" id="simPool"></div><div style="display:flex;gap:8px;margin-bottom:.9rem;flex-wrap:wrap"><button id="simClear" style="padding:5px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:12px;cursor:pointer">초기화</button><button id="simAuto" style="padding:5px 12px;background:var(--accent)22;border:1px solid var(--accent)44;border-radius:6px;color:var(--accent);font-size:12px;cursor:pointer">최적 팀 자동 추천</button></div><div id="simResult"></div></div>';

  var selected=new Set();

  function buildPool(){
    var pool=document.getElementById('simPool');
    pool.innerHTML='';
    members.forEach(function(m){
      var col=COLORS[m.mbti]||'#888';
      var btn=document.createElement('button');
      var isSel=selected.has(m.name);
      btn.style.cssText='padding:4px 10px;border:1px solid '+(isSel?col:'var(--border)')+';border-radius:99px;background:'+(isSel?col+'22':'transparent')+';color:'+(isSel?col:'var(--text2)')+';font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s';
      btn.innerHTML=m.name+' <span style="font-family:Space Mono;font-size:9px">'+m.mbti+'</span>';
      btn.onclick=function(){
        if(selected.has(m.name)) selected.delete(m.name);
        else if(selected.size<6) selected.add(m.name);
        buildPool(); calcSim();
      };
      pool.appendChild(btn);
    });
  }

  function calcSim(){
    var res=document.getElementById('simResult');
    var team=members.filter(function(m){return selected.has(m.name);});
    if(team.length<2){res.innerHTML='<div style="color:var(--text3);font-size:13px">2명 이상 선택하면 분석이 시작됩니다.</div>';return;}
    var types=team.map(function(m){return m.mbti;});
    var unique=new Set(types).size;
    var hasNT=types.some(function(t){return t[1]==='N'&&t[2]==='T';});
    var hasSJ=types.some(function(t){return ['ISTJ','ESTJ','ISFJ'].includes(t);});
    var hasSTP=types.some(function(t){return t[1]==='S'&&t[3]==='P';});
    var hasConn=types.some(function(t){return ['ENFJ','ESFJ','INFJ','INFP','ISFP'].includes(t);});
    var iCount=types.filter(function(t){return t[0]==='I';}).length;
    var eCount=team.length-iCount;
    var jCount2=types.filter(function(t){return t[3]==='J';}).length;
    var tCount=types.filter(function(t){return t[2]==='T';}).length;
    var fCount=team.length-tCount;
    var istjCount=types.filter(function(t){return t==='ISTJ';}).length;
    var balance=60;
    if(hasNT) balance+=10; if(hasSJ) balance+=10; if(hasSTP) balance+=8; if(hasConn) balance+=10;
    if(unique>=3) balance+=7; if(eCount>0) balance+=5; if(fCount>0) balance+=5;
    balance=Math.min(100,balance);
    var groupthink=Math.round(istjCount/team.length*50+(team.length-unique)/team.length*35+iCount/team.length*15);
    groupthink=Math.min(100,groupthink);
    var synergy=Math.round(unique/team.length*40+balance*0.4+(100-groupthink)*0.2);
    var balCol=balance>=80?'#4dbb8a':balance>=60?'#f0b840':'#ff6b6b';
    var gtCol=groupthink>=60?'#ff6b6b':groupthink>=40?'#f0b840':'#4dbb8a';
    var roleCovers=[
      {role:'전략 설계 (NT)',ok:hasNT,who:'INTJ·INTP 포함'},
      {role:'실행 관리 (SJ)',ok:hasSJ,who:'ISTJ·ESTJ 포함'},
      {role:'현장 대응 (SP)',ok:hasSTP,who:'ISTP 포함'},
      {role:'팀 연결 (NF/SF)',ok:hasConn,who:'ENFJ·ESFJ 등 포함'},
      {role:'외향형 소통',ok:eCount>0,who:'E 유형 1명 이상'},
      {role:'감성 균형 (F)',ok:fCount>0,who:'F 유형 1명 이상'},
    ];
    var warnings=[],recs=[];
    if(istjCount/team.length>0.5) warnings.push('ISTJ가 '+Math.round(istjCount/team.length*100)+'%로 과다 — 집단사고 위험');
    if(!hasNT) recs.push('NT(INTJ·INTP) 추가로 전략 설계 역량 보완');
    if(!hasConn) recs.push('NF/ESFJ 추가로 팀 화합 및 소통 허브 확보');
    if(eCount===0) recs.push('E 유형 추가로 대외 소통·퍼실리테이션 보완');
    if(fCount===0) recs.push('F 유형 추가로 팀 감성 균형 보완');
    res.innerHTML=
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:.9rem"><div style="text-align:center;background:var(--bg3);border-radius:10px;padding:.9rem"><div style="font-size:28px;font-weight:700;color:'+balCol+'">'+balance+'</div><div style="font-size:12px;color:var(--text2)">팀 균형 점수</div></div><div style="text-align:center;background:var(--bg3);border-radius:10px;padding:.9rem"><div style="font-size:28px;font-weight:700;color:'+gtCol+'">'+groupthink+'%</div><div style="font-size:12px;color:var(--text2)">집단사고 위험도</div></div><div style="text-align:center;background:var(--bg3);border-radius:10px;padding:.9rem"><div style="font-size:28px;font-weight:700;color:var(--accent)">'+synergy+'</div><div style="font-size:12px;color:var(--text2)">시너지 지수</div></div></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.9rem">'+team.map(function(m){var col=COLORS[m.mbti]||'#888';return '<span style="font-size:11px;padding:2px 9px;border-radius:99px;background:'+col+'22;color:'+col+';border:1px solid '+col+'44">'+m.name+' '+m.mbti+'</span>';}).join('')+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.8rem"><div style="background:var(--bg3);border-radius:8px;padding:.8rem"><div style="font-size:11px;color:var(--text3);margin-bottom:.5rem">역할 커버리지</div>'+roleCovers.map(function(r){return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:.25rem"><span style="color:'+(r.ok?'#4dbb8a':'#ff6b6b')+'">'+(r.ok?'✓':'✗')+'</span><span style="color:'+(r.ok?'var(--text2)':'var(--text3)')+'">'+r.role+'</span>'+(r.ok?'':'<span style="font-size:10px;color:var(--text3)">← '+r.who+'</span>')+'</div>';}).join('')+'</div><div style="background:var(--bg3);border-radius:8px;padding:.8rem"><div style="font-size:11px;color:var(--text3);margin-bottom:.5rem">구성 분포</div>'+[['I/E','I '+iCount+'명 · E '+eCount+'명'],['T/F','T '+tCount+'명 · F '+fCount+'명'],['J/P','J '+jCount2+'명 · P '+(team.length-jCount2)+'명'],['유형 다양성',unique+'가지 유형']].map(function(kv){return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text3)">'+kv[0]+'</span><span style="color:var(--text2)">'+kv[1]+'</span></div>';}).join('')+'</div></div>'+
      (warnings.length?'<div style="background:#ff6b6b0d;border:1px solid #ff6b6b44;border-radius:8px;padding:.7rem;margin-bottom:.7rem"><div style="font-size:11px;color:#ff6b6b;margin-bottom:.3rem">경고</div>'+warnings.map(function(w){return '<div style="font-size:12px;color:var(--text2)">· '+w+'</div>';}).join('')+'</div>':'')+
      (recs.length?'<div style="background:var(--accent)0d;border:1px solid var(--accent)33;border-radius:8px;padding:.7rem"><div style="font-size:11px;color:var(--accent);margin-bottom:.3rem">권장 보완 사항</div>'+recs.map(function(r){return '<div style="font-size:12px;color:var(--text2)">→ '+r+'</div>';}).join('')+'</div>':'');
  }
  document.getElementById('simClear').onclick=function(){selected.clear();buildPool();calcSim();};
  document.getElementById('simAuto').onclick=function(){
    selected.clear();
    var picks=[members.find(function(m){return m.mbti==='INTJ';}),members.find(function(m){return m.mbti==='ISTJ'&&m.leader;}),members.find(function(m){return m.mbti==='ISTP';}),members.find(function(m){return m.mbti==='ENFJ';}),members.find(function(m){return m.mbti==='INTP';}),members.find(function(m){return m.mbti==='ESFJ';})].filter(Boolean);
    picks.forEach(function(m){selected.add(m.name);});
    buildPool();calcSim();
  };
  buildPool();calcSim();
})();

})();
